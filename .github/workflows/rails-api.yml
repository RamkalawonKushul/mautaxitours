name: Rails API tests

on:
  push:
    branches: [platform-modernization]
    paths:
      - "backend/**"
      - ".github/workflows/rails-api.yml"
      - "render.yaml"
  pull_request:
    branches: [platform-modernization]
    paths:
      - "backend/**"
      - ".github/workflows/rails-api.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mautaxi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mautaxi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mautaxi_test
      SECRET_KEY_BASE: test-secret-key-base-for-ci-only
      CORS_ORIGINS: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.13"
          bundler-cache: true
          working-directory: backend
      - name: Prepare database
        run: bundle exec rails db:prepare
      - name: Run test suite
        run: bundle exec rails test
