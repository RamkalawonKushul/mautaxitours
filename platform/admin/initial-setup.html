<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MauTaxi Tours — First Administrator Setup</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17324f; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 460px); padding: 30px; border: 1px solid #dce5ef; border-radius: 18px; background: #fff; box-shadow: 0 18px 55px rgba(20, 48, 78, .09); }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { color: #60758b; line-height: 1.55; }
    label { display: block; margin: 18px 0 7px; font-size: 14px; font-weight: 650; }
    input { width: 100%; min-height: 46px; padding: 11px 13px; border: 1px solid #cbd7e4; border-radius: 9px; font: inherit; }
    input:focus { outline: 3px solid rgba(58,120,201,.16); border-color: #3a78c9; }
    button { width: 100%; margin-top: 22px; min-height: 48px; border: 0; border-radius: 9px; color: white; background: #173b65; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #result { min-height: 24px; margin-top: 16px; font-size: 14px; overflow-wrap: anywhere; }
    .notice { padding: 12px; border-radius: 9px; background: #fff7e6; color: #795416; font-size: 13px; }
    .success { color: #17663b; } .error { color: #a32929; }
  </style>
</head>
<body>
  <main>
    <h1>First administrator setup</h1>
    <p>Use this page once to create the first MauTaxi administrator for the trial API.</p>
    <div class="notice">Keep your setup key and password private. This page does not save them in the browser.</div>
    <form id="setupForm">
      <label for="setupToken">One-time setup key</label>
      <input id="setupToken" type="password" autocomplete="off" required>
      <label for="email">Administrator email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Administrator password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="14" required>
      <button id="submitButton" type="submit">Create administrator</button>
    </form>
    <div id="result" role="status" aria-live="polite"></div>
  </main>
  <script>
    const API = "https://mautaxi-api-trial.onrender.com";
    const form = document.getElementById("setupForm");
    const button = document.getElementById("submitButton");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      result.className = "";
      result.textContent = "Creating administrator…";
      const setupToken = document.getElementById("setupToken").value;
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const response = await fetch(API + "/api/v1/admin/initial_setup", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Admin-Setup-Token": setupToken
          },
          body: JSON.stringify({ admin: { email, password } })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Setup failed (" + response.status + ").");
        result.className = "success";
        result.textContent = "Administrator created successfully for " + data.admin.email + ". Now remove ADMIN_SETUP_TOKEN from Render Environment, then sign in at the admin dashboard.";
        document.getElementById("setupToken").value = "";
        document.getElementById("password").value = "";
      } catch (error) {
        result.className = "error";
        result.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
