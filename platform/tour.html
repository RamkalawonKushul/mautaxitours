<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102b46"><title>Tour details | MauTaxi Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#102b46;--blue:#3A78C9;--sky:#eaf3fc;--ink:#172b40;--muted:#687b8e;--line:#e4ebf2;--paper:#f7f9fc;--white:#fff;--gold:#e6b45c;--shadow:0 18px 50px #102b4612}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "DM Sans",sans-serif}h1,h2,h3{font-family:Manrope,sans-serif;line-height:1.16;letter-spacing:-.035em}a{color:inherit;text-decoration:none}.top{background:var(--navy);color:#d8e8f8;text-align:center;padding:8px 15px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.header{height:78px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(5vw,22px);border-bottom:1px solid var(--line)}.logo{height:49px;width:auto;max-width:190px;object-fit:contain}.btn{border:0;border-radius:11px;padding:13px 18px;background:var(--blue);color:white;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}.btn.dark{background:var(--navy)}.wrap{max-width:1160px;margin:36px auto;padding:0 22px}.crumb{font-size:12px;color:var(--muted);margin-bottom:18px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.hero-img{min-height:380px;border-radius:16px;background:#dce8f2 center/cover}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.hero h1{font-size:clamp(30px,4vw,48px);margin:12px 0}.lead{color:var(--muted);font-size:15px}.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:18px 0}.prices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}.price{background:var(--sky);border-radius:12px;padding:13px}.price b{display:block;font:800 20px Manrope;color:var(--navy)}.price small{color:var(--muted);font-size:11px}.price.note{background:#fff8e9;border:1px solid #f1dfba}.notice{font-size:11px;color:#785d2b;background:#fff8e9;border:1px solid #f1dfba;border-radius:10px;padding:11px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:23px}.panel h2{font-size:22px;margin:0 0 14px}.panel p{color:var(--muted)}ul{padding-left:20px;margin:0}li{padding:5px 0;color:#43586d}.itinerary{counter-reset:stop;list-style:none;padding:0}.itinerary li{counter-increment:stop;display:flex;gap:12px;align-items:flex-start}.itinerary li:before{content:counter(stop,decimal-leading-zero);font:800 12px Manrope;color:var(--blue);background:var(--sky);padding:6px 8px;border-radius:8px}.footer{margin-top:55px;background:#0b2035;color:#b6c7d7;padding:26px;text-align:center;font-size:12px}.error{padding:80px 20px;text-align:center}.error h1{font-size:30px}@media(max-width:800px){.hero{grid-template-columns:1fr}.hero-img{min-height:260px}.panel-grid{grid-template-columns:1fr}}@media(max-width:550px){.header{padding:0 16px}.wrap{padding:0 14px;margin:22px auto}.hero{padding:13px}.hero-img{min-height:220px}.prices{grid-template-columns:1fr 1fr}.panel{padding:18px}.actions .btn{width:100%}}
</style>
</head>
<body>
<div class="top">Trusted Since 2000 · First of the Millennium</div>
<header class="header"><a href="index.html"><img class="logo" src="../assets/images/logo11.png" alt="MauTaxi Tours"></a><a href="index.html#tours" style="font-weight:800;color:var(--blue)">← All experiences</a></header>
<main class="wrap" id="content"><div class="error"><h1>Loading tour details…</h1></div></main>
<footer class="footer">© <span id="year"></span> MauTaxi Tours · Mauritius · <a href="mailto:mru@mautaxitours.com">mru@mautaxitours.com</a> · +230 58 22 44 12</footer>
<script src="tour-data.js"></script>
<script>
const params=new URLSearchParams(location.search);
const id=params.get('id');
const tours=window.MAUTAXI_TOURS||[];
const t=tours.find(x=>x.id===id);
document.getElementById('year').textContent=new Date().getFullYear();
const prettyTitle=s=>String(s||'').toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()).replace(/\b(Aux|De|Du|Des|Et|The|And|Of)\b/g,c=>c.toLowerCase());
const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!t){document.getElementById('content').innerHTML='<div class="error"><h1>Tour not found</h1><p>Please return to our experiences catalogue.</p><a class="btn dark" href="index.html#tours">Browse tours</a></div>'}
else{
const wa='https://wa.me/23058224412?text='+encodeURIComponent('Hello MauTaxi Tours, I would like to enquire about '+t.name+'. Please confirm availability and the total price.');
const priceCards='<div class="price"><small>Private transport · up to 4 passengers</small><b>'+safe(t.taxiPrice)+'</b><small>Taxi / vehicle fare as published</small></div>'+(t.adult?'<div class="price"><small>Activity ticket</small><b>'+safe(t.adult)+'</b><small>Per adult</small></div><div class="price"><small>Child activity ticket</small><b>'+safe(t.child)+'</b><small>Per child, age limits may apply</small></div><div class="price"><small>Baby activity ticket</small><b>'+safe(t.baby)+'</b><small>As published on the original tour page</small></div>':'<div class="price note"><small>Attraction / entry tickets</small><b>Quoted separately</b><small>Unless stated as included</small></div>');
document.getElementById('content').innerHTML='<div class="crumb"><a href="index.html">Home</a> / <a href="index.html#tours">Experiences</a> / '+safe(prettyTitle(t.name))+'</div><section class="hero"><div class="hero-img" style="background-image:url(&quot;'+safe(t.hero)+'&quot;)"></div><div><div class="eyebrow">'+safe(t.category==='sea'?'Sea & boat experience':t.category==='nature'?'Nature & adventure':'Private island sightseeing')+'</div><h1>'+safe(t.name)+'</h1><p class="lead">'+safe(t.description)+'</p><div class="meta"><span>◷ '+safe(t.duration)+'</span><span>⌖ '+safe(t.area)+'</span><span>Private transport available</span></div><div class="prices">'+priceCards+'</div><div class="notice">Prices shown are transcribed from the existing MauTaxi Tours pages. Please ask us to reconfirm availability, operator ticket prices and the final fare before payment. Transport and activity tickets are shown separately where applicable.</div><div class="actions"><button class="btn dark" id="addCart">Add to my trip</button><a class="btn" href="'+wa+'" target="_blank" rel="noopener">Enquire on WhatsApp ↗</a></div></div></section><div class="panel-grid"><section class="panel"><h2>About this experience</h2><p>'+safe(t.overview||t.description)+'</p></section><section class="panel"><h2>Tour itinerary</h2><ol class="itinerary">'+t.itinerary.map(x=>'<li>'+safe(x)+'</li>').join('')+'</ol><p style="font-size:11px">The order of stops may vary depending on pickup location, weather and operating conditions.</p></section><section class="panel"><h2>What is included</h2><ul>'+t.included.map(x=>'<li>'+safe(x)+'</li>').join('')+'</ul></section><section class="panel"><h2>Not included / additional costs</h2><ul>'+t.excluded.map(x=>'<li>'+safe(x)+'</li>').join('')+'</ul></section></div>';
document.getElementById('addCart').onclick=()=>{let cart=[];try{cart=JSON.parse(localStorage.getItem('mautaxi_cart_v2')||'[]')}catch(e){}const item=cart.find(x=>x.id===t.id);if(item)item.qty++;else cart.push({id:t.id,qty:1});localStorage.setItem('mautaxi_cart_v2',JSON.stringify(cart));location.href='index.html?cart=1#tours'};
}
</script>
</body></html>
