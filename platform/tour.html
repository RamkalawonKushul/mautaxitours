<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102b46"><meta name="robots" content="noindex,follow"><title>Explore Mauritius | MauTaxi Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#102b46;--blue:#3A78C9;--sky:#eaf3fc;--ink:#172b40;--muted:#687b8e;--line:#e4ebf2;--paper:#f6f8fb;--gold:#e6b45c;--shadow:0 18px 50px #102b4612}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 "DM Sans",sans-serif}h1,h2,h3{font-family:Manrope,sans-serif;line-height:1.14;letter-spacing:-.04em}a{color:inherit;text-decoration:none}.top{background:var(--navy);color:#d8e8f8;text-align:center;padding:8px 14px;font-size:10px;letter-spacing:.15em;text-transform:uppercase}.header{height:76px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(5vw,22px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.logo{height:49px;width:auto;max-width:190px;object-fit:contain}.back{font-size:13px;font-weight:800;color:var(--blue)}.wrap{max-width:1200px;margin:30px auto 75px;padding:0 22px}.crumb{font-size:12px;color:var(--muted);margin:0 0 17px}.crumb a:hover{color:var(--blue)}
.hero{position:relative;min-height:470px;border-radius:24px;overflow:hidden;background:var(--navy);box-shadow:var(--shadow);display:flex;align-items:end;color:white}.hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#071d32d9 0%,#0a294c85 52%,#102b4620 100%),linear-gradient(0deg,#071d32a6,transparent 65%)}.hero-copy{position:relative;z-index:1;padding:48px;max-width:760px}.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;font-weight:800;color:#bcdcff}.hero h1{font-size:clamp(34px,5vw,58px);margin:13px 0 12px;max-width:760px}.lead{font-size:16px;color:#e3edf7;max-width:640px;margin:0}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.meta span{background:#ffffff1c;border:1px solid #ffffff3b;border-radius:30px;padding:7px 12px;font-size:11px;font-weight:700;backdrop-filter:blur(8px)}
.booking-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.75fr);gap:22px;align-items:start;margin-top:24px}.main-column{display:grid;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 6px 24px #102b4607}.panel h2{font-size:23px;margin:0 0 12px}.panel p{margin:0;color:#52677b}.booking-card{position:sticky;top:96px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}.booking-card .label{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.13em;text-transform:uppercase}.transport-price{font:800 31px Manrope;color:var(--navy);margin:3px 0}.sub{font-size:12px;color:var(--muted)}.price-list{display:grid;gap:11px;margin:20px 0;padding:17px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.price-line{display:flex;justify-content:space-between;gap:12px;font-size:13px}.price-line span{color:var(--muted)}.price-line b{color:var(--navy);white-space:nowrap}.btn{border:0;border-radius:11px;padding:13px 18px;background:var(--blue);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%;font:700 14px "DM Sans",sans-serif}.btn.dark{background:var(--navy)}.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--line);margin-top:9px}.booking-note{font-size:11px;line-height:1.55;color:var(--muted);margin:13px 0 0}.sections{display:grid;grid-template-columns:1fr 1fr;gap:18px}.sections .wide{grid-column:1/-1}.eyebrow-blue{font-size:10px;color:var(--blue);font-weight:900;letter-spacing:.15em;text-transform:uppercase;margin-bottom:7px}.list{padding:0;margin:0;list-style:none;display:grid;gap:10px}.list li{display:flex;gap:11px;align-items:flex-start;color:#465d72;font-size:13px}.list li:before{content:"✓";display:grid;place-items:center;flex:0 0 22px;height:22px;border-radius:50%;background:var(--sky);color:var(--blue);font-weight:900}.itinerary{counter-reset:stop;list-style:none;padding:0;margin:0;display:grid;gap:0}.itinerary li{counter-increment:stop;display:flex;gap:13px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #edf1f5;color:#465d72;font-size:13px}.itinerary li:before{content:counter(stop,decimal-leading-zero);font:800 11px Manrope;color:var(--blue);background:var(--sky);padding:6px 8px;border-radius:8px}.notice{font-size:11px;color:#6e5b34;background:#fff8e9;border:1px solid #f1dfba;border-radius:11px;padding:12px;line-height:1.55}.footer{background:#0b2035;color:#b6c7d7;padding:28px;text-align:center;font-size:12px}.error{text-align:center;padding:100px 20px}.error h1{font-size:32px}
@media(max-width:850px){.booking-layout{grid-template-columns:1fr}.booking-card{position:static;order:-1}.hero{min-height:410px}.hero-copy{padding:34px}.sections{grid-template-columns:1fr}.sections .wide{grid-column:auto}}
@media(max-width:560px){.header{height:68px;padding:0 15px}.logo{height:42px}.wrap{padding:0 14px;margin:20px auto 48px}.hero{min-height:420px;border-radius:17px}.hero-copy{padding:25px 20px}.hero h1{font-size:36px}.lead{font-size:14px}.meta span{font-size:10px}.panel,.booking-card{padding:20px}.panel h2{font-size:21px}}
 .hero.image-unavailable{background:linear-gradient(135deg,#173c61,#86a9c9)}\n</style></head>
<body>
<div class="top">Trusted Since 2000 · First of the Millennium</div>
<header class="header"><a href="index.html"><img class="logo" src="../assets/images/logo11.png" alt="MauTaxi Tours"></a><a class="back" href="index.html#tours">← All experiences</a></header>
<main class="wrap" id="content"><div class="error"><h1>Preparing your experience…</h1></div></main>
<footer class="footer">© <span id="year"></span> MauTaxi Tours · Mauritius · <a href="mailto:mru@mautaxitours.com">mru@mautaxitours.com</a> · +230 58 22 44 12</footer>
<script src="config.js"></script><script src="tour-data.js"></script>
<script>
const params=new URLSearchParams(location.search), id=params.get('id'), baseTours=window.MAUTAXI_TOURS||[], overrides=(()=>{try{return JSON.parse(localStorage.getItem('mautaxi_tour_overrides_v1')||'{}')}catch(e){return {}}})(), custom=(()=>{try{return JSON.parse(localStorage.getItem('mautaxi_custom_tours_v1')||'[]')}catch(e){return []}})(), tours=baseTours.map(x=>({...x,...(overrides[x.id]||{})})).concat(custom), cachedDetail=sessionStorage.getItem('mautaxi_live_tour_'+id);let t=cachedDetail?JSON.parse(cachedDetail):tours.find(x=>x.id===id);if(cachedDetail)sessionStorage.removeItem('mautaxi_live_tour_'+id);
document.getElementById('year').textContent=new Date().getFullYear();
const pretty=s=>String(s||'').toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()).replace(/\b(Aux|De|Du|Des|Et|The|And|Of)\b/g,c=>c.toLowerCase());
const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!t){document.getElementById('content').innerHTML='<div class="error"><h1>Experience not found</h1><p>Please return to our island experiences.</p><a class="btn dark" href="index.html#tours">Browse experiences</a></div>'}
else{

const prices='<div class="price-line"><span>Private transport · up to 4</span><b>'+safe(t.taxiPrice)+'</b></div>'+(t.adult?'<div class="price-line"><span>Activity · per adult</span><b>'+safe(t.adult)+'</b></div><div class="price-line"><span>Activity · per child</span><b>'+safe(t.child)+'</b></div><div class="price-line"><span>Baby ticket</span><b>'+safe(t.baby)+'</b></div>':'<div class="price-line"><span>Attraction tickets</span><b>Quoted separately</b></div>');
const whats='https://wa.me/23058224412?text='+encodeURIComponent('Hello MauTaxi Tours, I am interested in '+t.name+'. Please confirm availability and the final price.');
document.getElementById('content').innerHTML='<div class="crumb"><a href="index.html">Home</a> / <a href="index.html#tours">Experiences</a> / '+safe(pretty(t.name))+'</div><section class="hero"><img class="hero-photo" src="'+safe(t.hero)+'"  alt="'+safe(t.name)+'" fetchpriority="high" referrerpolicy="no-referrer" onerror="this.onerror=null;this.style.display=&#39;none&#39;;this.parentElement.classList.add(&#39;image-unavailable&#39;)"><div class="hero-copy"><div class="eyebrow">'+safe(t.category==='sea'?'Ocean & island experience':t.category==='nature'?'Nature & adventure':'Private island discovery')+'</div><h1>'+safe(pretty(t.name))+'</h1><p class="lead">'+safe(t.description)+'</p><div class="meta"><span>◷ '+safe(t.duration)+'</span><span>⌖ '+safe(t.area)+'</span><span>Private transport available</span></div></div></section><div class="booking-layout"><div class="main-column"><div class="sections"><section class="panel wide"><div class="eyebrow-blue">The experience</div><h2>Discover something special</h2><p>'+safe(t.overview||t.description)+'</p></section><section class="panel"><div class="eyebrow-blue">Your day</div><h2>Itinerary</h2><ol class="itinerary">'+(t.itinerary||[]).map(x=>'<li>'+safe(x)+'</li>').join('')+'</ol></section><section class="panel"><div class="eyebrow-blue">Good to know</div><h2>Included</h2><ul class="list">'+(t.included||[]).map(x=>'<li>'+safe(x)+'</li>').join('')+'</ul><h2 style="margin-top:24px">Not included</h2><ul class="list">'+(t.excluded||[]).map(x=>'<li>'+safe(x)+'</li>').join('')+'</ul></section></div></div><aside class="booking-card"><div class="label">Private transport from</div><div class="transport-price">'+safe(t.taxiPrice)+'</div><div class="sub">Standard Car · up to 4 passengers</div><div class="price-list">'+prices+'</div><div class="notice">Activity prices are per person. The price shown is for a Standard Car (up to 4 passengers). You can choose an SUV, Family Van, Minivan, Executive Minivan or Coaster/Bus in your cart. The transport price updates automatically to match your vehicle and group size. Activity tickets are per person where listed; unpriced tickets are confirmed separately.</div><button class="btn dark" id="addCart" style="margin-top:15px">Add to my trip <span>→</span></button><a class="btn secondary" href="'+whats+'" target="_blank" rel="noopener">Ask a question on WhatsApp</a><p class="booking-note">Build your itinerary in the cart. Online payment will be available through the secure SBM checkout once merchant gateway activation is completed.</p></aside></div>';
document.getElementById('addCart').onclick=()=>{let cart=[];try{cart=JSON.parse(localStorage.getItem('mautaxi_cart_v2')||'[]')}catch(e){}const item=cart.find(x=>x.id===t.id);if(!item)cart.push({id:t.id,qty:1});localStorage.setItem('mautaxi_cart_v2',JSON.stringify(cart));location.href='index.html?cart=1#tours'};
}
if(window.MAUTAXI_API_URL&&!cachedDetail){fetch(window.MAUTAXI_API_URL.replace(/\/$/,'')+'/api/v1/tours/'+encodeURIComponent(id)).then(r=>r.ok?r.json():null).then(d=>{if(!d)return;const currency=d.currency==='EUR'?'€':d.currency+' ';const mapped={id:d.slug,name:d.name,category:d.category_key||'culture',duration:d.duration_minutes?Math.floor(d.duration_minutes/60)+'h'+(d.duration_minutes%60?' '+d.duration_minutes%60+'m':''):'Duration on request',area:d.area||'Mauritius',taxiPrice:currency+(Number(d.price_cents)/100).toFixed(2),adult:d.adult_price_cents==null?'':currency+(Number(d.adult_price_cents)/100).toFixed(2),child:d.child_price_cents==null?'':currency+(Number(d.child_price_cents)/100).toFixed(2),baby:d.baby_price_label||'',description:d.summary||'',overview:d.description||'',hero:d.image_url||'',included:d.included_items||[],excluded:d.excluded_items||[],itinerary:d.itinerary||[]};sessionStorage.setItem('mautaxi_live_tour_'+id,JSON.stringify(mapped));location.reload()}).catch(()=>{})}</script></body></html>
