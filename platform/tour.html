function updateLivePrice(forceBestFit=false){
 const adults=Number(paxInputs.adults.value),children=Number(paxInputs.children.value),babies=Number(paxInputs.babies.value),people=adults+children+babies;

function cartEscape(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function getCartTour(item){return (window.MAUTAXI_TOURS||[]).find(x=>x.id===item.id)||(item.id===t.id?t:null)}
function tourCartTotals(){const cart=readTourCart(),p=readTourPassengers(),adults=Math.max(1,Number(p.adults)||2),children=Number(p.children)||0,babies=Number(p.babies)||0,people=adults+children+babies;let total=0,transportTotal=0,activityTotal=0;cart.forEach(item=>{const tour=getCartTour(item);if(!tour)return;let vehicle=TOUR_VEHICLES.find(v=>v.type===item.transportation_type);const previous=Number(item.last_group_size||0);if(!vehicle||vehicle.capacity<people||previous!==people){vehicle=TOUR_VEHICLES.find(v=>v.capacity>=people)||null;if(vehicle)item.transportation_type=vehicle.type;}item.last_group_size=people;item.passengers={adults,children,babies};const transport=vehicle?parsePrice(tour.taxiPrice)+Number(vehicle.extra||0):parsePrice(tour.taxiPrice),activity=parsePrice(tour.adult)*adults+parsePrice(tour.child)*children;transportTotal+=transport;activityTotal+=activity;total+=transport+activity});localStorage.setItem('mautaxi_cart_v2',JSON.stringify(cart));return {cart,p,adults,children,babies,people,total,transportTotal,activityTotal}}

 summary.innerHTML=editor+'<div class="tour-cart-summary-line" style="margin-top:12px"><span>Private transport subtotal</span><strong>'+euro(transportTotal)+'</strong></div><div class="tour-cart-summary-line"><span>Activity tickets subtotal</span><strong>'+euro(activityTotal)+'</strong></div><div class="tour-cart-summary-line" style="border-top:1px solid #d6e2ee;margin-top:9px;padding-top:10px"><span>Estimated listed total</span><strong style="font-size:22px">'+euro(transportTotal+activityTotal)+'</strong></div>'+(unknownTickets?'<small>Some attraction tickets are not priced yet and are excluded from this estimate.</small>':'')+(capacityWarnings.length?'<small>'+capacityWarnings.join('<br>')+'</small>':'')+'<small>Unpriced tickets and extras are confirmed separately.</small>';
