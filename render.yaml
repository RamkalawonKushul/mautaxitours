# MauTaxi Tours trial deployment.
# Uses Render free resources for development only; do not use for live bookings.
services:
  - type: web
    name: mautaxi-api-trial
    runtime: docker
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    branch: platform-modernization
    autoDeployTrigger: off
    healthCheckPath: /api/v1/health
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      - key: RAILS_SERVE_STATIC_FILES
        value: "1"
      - key: FORCE_SSL
        value: "true"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mautaxi-postgres-trial
          property: connectionString
      - key: CORS_ORIGINS
        value: https://mautaxitours.com,https://www.mautaxitours.com,https://mautaxitours.vercel.app
      - key: APP_HOST
        value: www.mautaxitours.com

databases:
  - name: mautaxi-postgres-trial
    databaseName: mautaxi_trial
    user: mautaxi
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []
