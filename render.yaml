# Render Blueprint for the MauTaxi Tours Rails API and PostgreSQL.
# This file is intentionally on platform-modernization; it does not change main.
services:
  - type: web
    name: mautaxi-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: singapore
    branch: platform-modernization
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/health
    preDeployCommand: bin/rails db:migrate
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      - key: RAILS_SERVE_STATIC_FILES
        value: "1"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mautaxi-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: https://mautaxitours.com,https://www.mautaxitours.com

databases:
  - name: mautaxi-postgres
    databaseName: mautaxi_production
    user: mautaxi
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "17"
    diskSizeGB: 5
